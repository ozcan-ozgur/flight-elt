services:
  postgres:
    image: postgres:16
    container_name: flight-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - flight_pgdata:/var/lib/postgresql/data

volumes:
  flight_pgdata:
