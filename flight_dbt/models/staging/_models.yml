version: 2

models:
  - name: stg_flight_states
    description: 'Cleaned and typed flight state vectors from Opensky.'
    columns:
    - name: id
      description: 'Surrogate key from the raw table.'
      data_tests:
        - not_null
        - unique

    - name: icao24
      description: 'Aircraft transponder address.'
      data_tests:
        - not_null
    - name: snapshot_at
      description: 'Timestamp of the API snapshot this row belongs to.'
      data_tests:
        - not_null